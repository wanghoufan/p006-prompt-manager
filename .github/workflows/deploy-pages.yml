name: Deploy trial to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 静态站没有 Node 运行时：本次构建临时移除 API 路由（不改仓库文件）。
      # MCP 是本机 stdio 子包，静态站不需要，且其依赖未在 CI 安装，一并排除以免根 tsconfig 类型检查失败。
      - name: Remove server-only code for static export
        run: rm -rf src/app/api mcp
      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /p006-prompt-manager
          NEXT_PUBLIC_BASE_PATH: /p006-prompt-manager
          NEXT_PUBLIC_STATIC_TRIAL: "1"
          NEXT_PUBLIC_SITE_URL: https://wanghoufan.github.io/p006-prompt-manager
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
